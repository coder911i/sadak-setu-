; ==============================================================================
; Sadak Setu — ESP32 Telematics Firmware PlatformIO Configuration
; ==============================================================================

[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor & Upload Settings
monitor_speed = 115200
upload_speed = 921600

; Required Third-Party Libraries
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.4
    mikalhart/TinyGPSPlus @ ^1.0.3

; Compiler Flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
