version: '3.9'

services:
  # ── Backend (Express + Prisma + NeonDB) ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: \
      JWT_SECRET: \
      AI_SERVICE_URL: http://ai-service:8000
      AI_MODE: live
    depends_on:
      ai-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── AI Service (FastAPI + YOLO) ──────────────────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    environment:
      AI_MODE: \
      YOLO_WEIGHTS_PATH: /app/models/road-damage/best.pt
      YOLO_CONF_THRESHOLD: '0.45'
      YOLO_IOU_THRESHOLD: '0.45'
    volumes:
      # Mount trained weights if available
      - ./ai-service/models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  default:
    name: sadaksetu_net
